# inference-host 开机只自动起 ASR。这台机器不做 TTS，不使用emotion。
# 不 offload。容器内都是 cuda:0（只看见自己那张卡）。

services:
  asr:
    image: ${ASR_IMAGE:?配置已准备好的 ASR 基础镜像}
    container_name: ff7-gpu-asr
    runtime: nvidia
    working_dir: /root/autodl-tmp/code
    command:
      - python
      - main_asr.py
      - --port
      - "8001"
      - --device
      - cuda:0
      - --model-path
      - /root/autodl-tmp/models/Qwen/Qwen3-ASR-1.7B
      - --config
      - /root/autodl-tmp/code/config.json
    ports:
      - "8001:8001"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"
      PYTHONUNBUFFERED: "1"
      HF_ENDPOINT: https://hf-mirror.com
      QWEN3_ASR_MODEL_PATH: /root/autodl-tmp/models/Qwen/Qwen3-ASR-1.7B
    volumes:
      - ${MODELS_DIR:?配置模型目录}:/root/autodl-tmp/models:ro
      - ./asr/main_asr.py:/root/autodl-tmp/code/main_asr.py:ro
      - ./asr/health.py:/root/autodl-tmp/code/health.py:ro
      - ./asr/config.json:/root/autodl-tmp/code/config.json:ro
      - ./asr/base:/root/autodl-tmp/code/base:ro
      - asr-cache:/app/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  asr-cache:
