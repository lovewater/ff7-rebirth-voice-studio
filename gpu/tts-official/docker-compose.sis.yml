# Run on the inference host: docker compose -f docker-compose.sis.yml up -d
# Each worker owns one 22GB card; model and speaker files are shared.
x-worker: &worker
  image: ff7-indextts-official:sis-2.0
  build:
    context: .
    dockerfile: Dockerfile.sis
    args:
      BASE_IMAGE: ${INDEXTTS_BASE_IMAGE:?配置含 CUDA 和 IndexTTS 依赖的基础镜像}
  restart: unless-stopped
  environment:
    MODEL_DIR: /models/IndexTTS-2
    DATA_DIR: /data
    INDEXTTS_PRECISION: fp16
    CUDA_VISIBLE_DEVICES: "0"
    UPSTREAM_REVISION: ee40fa7d6c6b8a2c7f06105f9f1e65775b74868c
    GPU_LOCK_PATH: /gpu-lock/inference.lock
    SEED_VC_URL: http://127.0.0.1:8811
    OMP_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
  volumes:
    - ${INDEXTTS_MODEL_DIR:?配置 IndexTTS 2.0 权重目录}:/models/IndexTTS-2
    - ./data:/data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8810/health', timeout=5)"]
    interval: 30s
    timeout: 10s
    start_period: 180s
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"
services:
  tts-gpu1:
    <<: *worker
    container_name: ff7-indextts-gpu1
    ports: ["8811:8810"]
    gpus:
      - driver: nvidia
        device_ids: ["1"]
        capabilities: [gpu]
  tts-gpu2:
    <<: *worker
    container_name: ff7-indextts-gpu2
    ports: ["8812:8810"]
    gpus:
      - driver: nvidia
        device_ids: ["2"]
        capabilities: [gpu]
